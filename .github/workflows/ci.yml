name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/azthrun/dreambig-nas-files
  # No build-record artifacts: Actions storage is limited.
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

# No job uploads artifacts. If one ever must, set retention-days: 1 on it.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/...

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          ports="$(docker compose config --format json | jq '[.services[].ports // [] | length] | add')"
          [ "$ports" = 1 ] || { echo "want exactly one published port, got $ports"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Smoke test
        run: scripts/smoke-test.sh "$IMAGE:ci"

  # Publishes only for a v* tag, and only after tests, the secret scan, compose validation
  # and the smoke test have passed. Prereleases (a "-" in the tag) skip :latest.
  publish:
    needs: [image, secrets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME}"
          tags="$IMAGE:$version,$IMAGE:sha-${GITHUB_SHA::7}"
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=image
